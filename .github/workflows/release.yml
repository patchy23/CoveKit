name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 标签发布前先跑与 CI 同口径的门禁：main 之前绿过不代表这个标签安全（T08-5）
  gates:
    name: 发布前质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: 标签与三处版本号一致
        run: python scripts/check_versions.py "${{ github.ref_name }}"
      - name: 文档与开发体系守卫
        run: |
          python -m unittest discover -s scripts -p test_doc_checks.py
          python scripts/check_markdown.py
          python scripts/check_doc_budget.py
      - name: 前端门禁
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run format:check
      - name: Rust 门禁
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --no-default-features --all-targets -- -D warnings
          cargo test --no-default-features
      - name: Rust 规范检查
        run: python scripts/check_rust_rules.py

  publish:
    name: Build ${{ matrix.platform }}
    needs: [gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --bundles nsis
          - platform: macos
            os: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Generate updater release configuration
        run: pnpm release:config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      - name: 校验更新公钥已覆盖（占位公钥不得进入正式发布）
        run: python scripts/check_release_config.py
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: patchyBox v__VERSION__
          releaseBody: See CHANGELOG.md for release details.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
