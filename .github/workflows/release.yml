name: Alpha Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Alpha version and configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_versions.py "$RELEASE_TAG"
          python scripts/check_alpha_release.py "$RELEASE_TAG"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*${{ matrix.bundle == 'nsis' && '.exe' || '.dmg' }}
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Collect installers into prerelease draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const tag = process.env.RELEASE_TAG;
            const targets = {
              'x86_64-pc-windows-msvc': '.exe',
              'aarch64-apple-darwin': '.dmg',
              'x86_64-apple-darwin': '.dmg',
            };
            const assets = [];
            for (const [target, ext] of Object.entries(targets)) {
              const dir = path.join('release-assets', `installer-${target}`);
              const files = fs.readdirSync(dir).filter(f => f.endsWith(ext));
              if (files.length !== 1) throw new Error(`Expected one installer for ${target}, got ${files.length}`);
              assets.push({name: `CoveKit_${tag}_${target}${ext}`, data: fs.readFileSync(path.join(dir, files[0]))});
            }
            const sums = assets.map(a => `${crypto.createHash('sha256').update(a.data).digest('hex')}  ${a.name}`).join('\n') + '\n';
            assets.push({name: 'SHA256SUMS.txt', data: Buffer.from(sums)});
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) throw new Error('Refusing to overwrite a published release');
            const fields = {
              ...context.repo, name: `CoveKit ${tag}`, draft: true, prerelease: true,
              body: fs.readFileSync('.github/RELEASE_NOTES.md', 'utf8'),
            };
            if (release) {
              release = (await github.rest.repos.updateRelease({...fields, release_id: release.id})).data;
            } else {
              release = (await github.rest.repos.createRelease({...fields, tag_name: tag})).data;
            }
            const previous = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: release.id, per_page: 100});
            for (const asset of assets) {
              const old = previous.find(a => a.name === asset.name);
              if (old) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, ...asset});
            }
            core.notice(`Prerelease draft ready: ${release.html_url}`);
