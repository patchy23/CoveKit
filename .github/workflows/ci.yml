name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 判断变更影响
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
      doc_tools: ${{ steps.scope.outputs.doc_tools }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"

  docs-checks:
    needs: [changes]
    name: 文档与入口检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: needs.changes.outputs.doc_tools == 'true'
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_markdown.py
      - run: python scripts/check_doc_budget.py

  lint-and-test:
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    name: Lint & Test（前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check:deps
      - run: pnpm build:web

  rust-checks:
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: rustfmt 检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy 检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib
      - name: Rust 规范与注释检查（source_rules target：规则扫描 + 自证夹具）
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --test source_rules -- --nocapture

  build:
    name: Tauri Build（Windows 安装包）
    runs-on: windows-latest
    needs: [changes, lint-and-test, rust-checks, docs-checks]
    if: needs.changes.outputs.product == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: build
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: covekit-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Tauri Build（macOS dmg）
    runs-on: macos-latest
    needs: [changes, lint-and-test, rust-checks, docs-checks]
    if: needs.changes.outputs.product == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: build
      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: covekit-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  checks:
    name: CI 结果
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, docs-checks, lint-and-test, rust-checks, build, build-macos]
    steps:
      - name: 核对必需任务结果
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          DOC_RESULT: ${{ needs.docs-checks.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          FRONTEND: ${{ needs.lint-and-test.result }}
          RUST: ${{ needs.rust-checks.result }}
          WINDOWS: ${{ needs.build.result }}
          MACOS: ${{ needs.build-macos.result }}
        shell: bash
        run: |
          test "$CHANGE_RESULT" = success
          test "$DOC_RESULT" = success
          if [ "$PRODUCT" = true ]; then
            test "$FRONTEND" = success
            test "$RUST" = success
            test "$WINDOWS" = success
            test "$MACOS" = success
          else
            test "$PRODUCT" = false
            test "$FRONTEND" = skipped
            test "$RUST" = skipped
            test "$WINDOWS" = skipped
            test "$MACOS" = skipped
          fi
