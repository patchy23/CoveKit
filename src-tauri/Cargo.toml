[package]
name = "covekit"
version = "0.1.0"
description = "CoveKit 桌面工具箱"
authors = ["patchyx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "covekit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
webpki-roots = "0.26"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# HTTP/WS（TLS 统一 rustls/ring，禁双栈）
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["sync", "macros", "rt", "fs", "io-util", "time", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
aliyun-openapi-core-rust-sdk = "1.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
# SSH 插件：russh 客户端 + SFTP + 凭证 AES-GCM 加密（ssh-key 由 russh 依赖提供）
# ring 后端：避免 aws-lc-rs 在 Windows 依赖 NASM 汇编器
russh = { version = "0.62.5", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.4.0"
aes-gcm = "0.10"
rand = "0.8"
# Vault 凭证库（framework/vault）：系统密钥库存主密钥 + Argon2id 导出备份派生密钥
# keyring 3 没有 default feature，必须显式启用平台原生后端，否则 Windows/macOS 会退回进程内 mock
# （写后回读在同进程可能"成功"，但换进程/重启就读不到，等于没有系统级保护）。
# 两个 feature 的依赖在 keyring 内部已按 target 门控，非对应平台是空操作；本应用只发布 Windows/macOS。
keyring = { version = "3", features = ["apple-native", "windows-native"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
# 数据库工作台（database 插件）：驱动与 dbx 项目同款
# mysql: mysql_async（TLS 走 rustls ring 后端，与 http_ws 一致；default-rustls 会拉 aws-lc-rs 需 NASM）
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring", "client_ed25519", "chrono", "rust_decimal"] }
# postgresql: tokio-postgres + deadpool 连接池（与 dbx 同款）；TLS 走 rustls ring（与 http_ws 一致）
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
# redis: 连接管理器 + 暂不开 TLS feature（避免 rustls 后端与现有 ring 构建冲突，需要时再开）
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
toml = "1.1.6"

# 规范检查器（src-tauri/tests/source_rules，AR02）的唯一直接开发依赖。
# 依赖评审四问：① 用途=把自己写的 Rust 源码解析成 AST，替代已被证误判的逐行正则；
# ② 必要性=行级匹配无法区分测试模块/注释/字符串/属性，误报与漏报都已复现；
# ③ 替代方案=编译器自身无公开 API、手写解析器不划算；④ 成本=syn/proc-macro2 本就是
# tauri 宏展开的传递依赖（锁文件已有），这里按锁文件版本精确钉住，避免引入第二份版本；
# dev-dependencies 不参与产物打包，只在 cargo test/check 时编译。
[dev-dependencies]
syn = { version = "=2.0.119", default-features = false, features = [
  "full",
  "parsing",
  "printing",
  "proc-macro",
  "visit",
] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

[target.'cfg(windows)'.dependencies]
# framework/secure_store/win_acl：降级主密钥文件的 DACL 收紧（仅当前用户）
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# 体积优化：LTO 全程序优化 + 剥离符号表（安装包 7MB → ~5MB，功能零影响）
[profile.release]
lto = true
codegen-units = 1
strip = true
