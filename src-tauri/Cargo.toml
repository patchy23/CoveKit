[package]
name = "patchybox"
version = "0.1.0"
description = "patchyBox 桌面工具箱"
authors = ["patchy23"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "patchybox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
webpki-roots = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "fs", "io-util", "time", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
aliyun-openapi-core-rust-sdk = "1.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
# SSH 插件：russh 客户端 + SFTP + 凭证 AES-GCM 加密（ssh-key 由 russh 依赖提供）
# ring 后端：避免 aws-lc-rs 在 Windows 依赖 NASM 汇编器
russh = { version = "0.62.5", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.4.0"
aes-gcm = "0.10"
rand = "0.8"
# Vault 凭证库（framework/vault）：系统密钥库存主密钥 + Argon2id 导出备份派生密钥
keyring = "3"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
# 数据库工作台（database 插件）：驱动与 dbx 项目同款
# mysql: mysql_async（TLS 走 rustls ring 后端，与 http_ws 一致；default-rustls 会拉 aws-lc-rs 需 NASM）
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring", "client_ed25519", "chrono", "rust_decimal"] }
# postgresql: tokio-postgres + deadpool 连接池（与 dbx 同款）；TLS 走 rustls ring（与 http_ws 一致）
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
# redis: 连接管理器 + 暂不开 TLS feature（避免 rustls 后端与现有 ring 构建冲突，需要时再开）
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

# 体积优化：LTO 全程序优化 + 剥离符号表（安装包 7MB → ~5MB，功能零影响）
[profile.release]
lto = true
codegen-units = 1
strip = true
