<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlassBox · 沉浸玻璃（悬浮启动器）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --glass:rgba(255,255,255,.08);
    --glass-strong:rgba(255,255,255,.13);
    --glass-border:rgba(255,255,255,.18);
    --glass-border2:rgba(255,255,255,.32);
    --ink:#f4f8ff; --ink2:rgba(235,242,255,.72); --ink3:rgba(235,242,255,.45);
    --accent:#7dd3fc; --accent2:#a5f3fc; --accent-deep:#0284c7;
    --accent-ink:#052e4a;
    --accent-grad:linear-gradient(135deg,#38bdf8,#2dd4bf);
    --radius:20px;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    --disp:"Space Grotesk","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink); overflow:hidden;
    -webkit-font-smoothing:antialiased;
    background:#0a1224;
  }
  /* 动态背景 */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .bg .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
  .bg .b1{width:560px;height:560px;background:radial-gradient(circle,#2563eb,#0ea5e9);top:-140px;left:-120px}
  .bg .b2{width:520px;height:520px;background:radial-gradient(circle,#0891b2,#2dd4bf);bottom:-180px;right:-100px;animation-delay:-8s}
  .bg .b3{width:380px;height:380px;background:radial-gradient(circle,#7c3aed,#4f46e5);top:38%;left:56%;opacity:.4;animation-delay:-16s}
  .bg .grid-overlay{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 90% 80% at 50% 40%,#000 30%,transparent 75%);
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(60px,-40px) scale(1.08)}
    100%{transform:translate(-50px,50px) scale(.95)}
  }

  /* 顶部条 */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:14px;padding:18px 26px;
  }
  .clockpill{
    display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;
    background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
  }
  .clockpill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .clockpill .time{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em}
  .clockpill .date{font-size:12px;color:var(--ink2)}
  .topbar .spacer{flex:1}
  .topbar .btn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--glass-border);
    background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:all .18s;
  }
  .topbar .btn:hover{background:var(--glass-strong);color:var(--ink);transform:translateY(-1px)}
  .topbar .btn svg{width:17px;height:17px}

  /* 主面板 */
  .stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:90px 30px 130px}
  .panel{
    width:min(880px,100%);border-radius:26px;position:relative;
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
    box-shadow:0 30px 80px rgba(2,10,30,.55),inset 0 1px 0 rgba(255,255,255,.14);
    padding:26px 28px 24px;animation:rise .5s cubic-bezier(.2,.9,.25,1.2);
  }
  @keyframes rise{from{transform:translateY(26px) scale(.97);opacity:0}to{transform:none;opacity:1}}

  .panel .grab{
    width:46px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);margin:0 auto 18px;
  }
  .searchrow{display:flex;align-items:center;gap:14px;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
  .searchrow .mag{width:42px;height:42px;border-radius:14px;background:var(--accent-grad);display:grid;place-items:center;color:var(--accent-ink);flex:none;box-shadow:0 6px 20px rgba(56,189,248,.35)}
  .searchrow .mag svg{width:20px;height:20px}
  .searchrow input{
    flex:1;background:none;border:none;outline:none;color:var(--ink);
    font-family:var(--sans);font-size:19px;font-weight:500;letter-spacing:.01em;
  }
  .searchrow input::placeholder{color:var(--ink3)}
  .searchrow kbd{
    font-family:var(--disp);font-size:11px;color:var(--ink2);padding:5px 10px;border-radius:8px;
    background:rgba(255,255,255,.08);border:1px solid var(--glass-border);border-bottom-width:2px;flex:none;
  }

  /* 分类标签 */
  .tabs{display:flex;gap:8px;margin:16px 2px 4px;flex-wrap:wrap}
  .tab{
    padding:7px 16px;border-radius:999px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none;
    background:rgba(255,255,255,.05);border:1px solid transparent;transition:all .18s;
  }
  .tab:hover{color:var(--ink);background:rgba(255,255,255,.1)}
  .tab.on{background:var(--accent-grad);color:var(--accent-ink);font-weight:700;box-shadow:0 4px 16px rgba(56,189,248,.35)}

  /* 工具网格 */
  .tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin-top:14px;max-height:330px;overflow-y:auto;padding:2px}
  .tools::-webkit-scrollbar{width:7px}
  .tools::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  .tool{
    border-radius:16px;padding:16px 10px 13px;display:flex;flex-direction:column;align-items:center;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);cursor:pointer;
    transition:transform .16s,background .16s,border-color .16s,box-shadow .16s;position:relative;
  }
  .tool:hover{transform:translateY(-3px);background:rgba(255,255,255,.11);border-color:var(--glass-border2);box-shadow:0 10px 30px rgba(2,10,30,.4)}
  .tool .t-ic{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.12);color:var(--accent2);
  }
  .tool .t-ic svg{width:23px;height:23px}
  .tool .t-nm{font-size:12px;color:var(--ink);text-align:center;line-height:1.3;font-weight:500}
  .tool .t-hot{
    position:absolute;top:-6px;right:-4px;font-size:9px;font-weight:700;letter-spacing:.04em;
    background:var(--accent-grad);color:var(--accent-ink);padding:2px 7px;border-radius:999px;
  }
  .tool.fav::after{content:"★";position:absolute;top:8px;right:10px;font-size:11px;color:#fbbf24;text-shadow:0 1px 6px rgba(0,0,0,.5)}

  .panel .foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 6px}
  .panel .foot .hint{font-size:11.5px;color:var(--ink3)}
  .panel .foot .hint b{color:var(--ink2);font-weight:500}

  /* Dock */
  .dock{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;
    display:flex;align-items:flex-end;gap:10px;padding:10px 16px;border-radius:22px;
    background:var(--glass-strong);border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
    box-shadow:0 16px 44px rgba(2,10,30,.5),inset 0 1px 0 rgba(255,255,255,.16);
    animation:rise .5s .08s cubic-bezier(.2,.9,.25,1.2) backwards;
  }
  .dock .d-item{
    width:50px;height:50px;border-radius:14px;display:grid;place-items:center;cursor:pointer;
    background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.14);color:var(--accent2);position:relative;
    transition:transform .18s cubic-bezier(.3,1.6,.4,1),background .18s;
  }
  .dock .d-item svg{width:23px;height:23px}
  .dock .d-item:hover{transform:translateY(-8px) scale(1.12);background:var(--accent-grad);color:var(--accent-ink)}
  .dock .d-item .d-tip{
    position:absolute;bottom:60px;left:50%;transform:translateX(-50%) translateY(4px);
    background:rgba(10,20,45,.85);border:1px solid var(--glass-border);color:var(--ink);
    font-size:11px;padding:4px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:all .15s;backdrop-filter:blur(10px);
  }
  .dock .d-item:hover .d-tip{opacity:1;transform:translateX(-50%) translateY(0)}
  .dock .sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.16)}

  /* 启动器弹窗 */
  .launch{
    position:fixed;inset:0;z-index:60;display:none;place-items:center;
    background:rgba(5,10,25,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .launch.show{display:grid;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .launch .card{
    width:min(520px,92vw);border-radius:24px;padding:26px;
    background:rgba(16,26,50,.72);border:1px solid var(--glass-border);
    backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
    box-shadow:0 30px 80px rgba(2,10,30,.6);animation:pop .3s cubic-bezier(.2,.9,.25,1.15);
  }
  @keyframes pop{from{transform:scale(.94) translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .launch .l-head{display:flex;align-items:center;gap:13px}
  .launch .l-ic{width:50px;height:50px;border-radius:15px;background:var(--accent-grad);display:grid;place-items:center;color:var(--accent-ink);flex:none;box-shadow:0 8px 24px rgba(56,189,248,.4)}
  .launch .l-ic svg{width:25px;height:25px}
  .launch h2{font-size:18px;font-weight:700}
  .launch .l-sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
  .launch .l-x{margin-left:auto;width:34px;height:34px;border-radius:11px;border:1px solid var(--glass-border);background:rgba(255,255,255,.06);color:var(--ink2);cursor:pointer;font-size:13px}
  .launch .l-x:hover{background:rgba(255,255,255,.14);color:var(--ink)}
  .launch .l-body{margin-top:20px;display:flex;flex-direction:column;gap:12px}
  .launch textarea,.launch input[type=text]{
    width:100%;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:13px;
    padding:12px 14px;color:var(--ink);font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;
    outline:none;resize:vertical;min-height:80px;transition:border-color .15s;
  }
  .launch input[type=text]{min-height:0;height:42px;font-family:var(--sans)}
  .launch textarea:focus,.launch input[type=text]:focus{border-color:var(--accent)}
  .launch .l-row{display:flex;gap:9px}
  .launch .l-btn{
    height:40px;padding:0 20px;border-radius:12px;border:none;cursor:pointer;font-family:var(--sans);
    font-size:13px;font-weight:700;background:rgba(255,255,255,.1);color:var(--ink);transition:all .15s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .launch .l-btn:hover{background:rgba(255,255,255,.18)}
  .launch .l-btn.primary{background:var(--accent-grad);color:var(--accent-ink);box-shadow:0 6px 20px rgba(56,189,248,.35)}
  .launch .l-btn.primary:hover{filter:brightness(1.1)}
  .launch .l-out{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:13px;
    padding:13px 15px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px;
    color:var(--accent2);white-space:pre-wrap;word-break:break-all;line-height:1.6;max-height:190px;overflow:auto;
  }
  .launch .l-out.err{color:#fda4af}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-overlay"></div>
</div>

<!-- 顶栏 -->
<div class="topbar">
  <div class="clockpill">
    <span class="dot"></span>
    <span class="time" id="clock">--:--</span>
    <span class="date" id="date"></span>
  </div>
  <div class="spacer"></div>
  <button class="btn" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></svg></button>
  <button class="btn" title="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg></button>
</div>

<!-- 主面板 -->
<div class="stage">
  <div class="panel">
    <div class="grab"></div>
    <div class="searchrow">
      <div class="mag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg></div>
      <input id="q" type="text" placeholder="搜索工具，或直接输入文本快速处理…" spellcheck="false">
      <kbd>⌘ K</kbd>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="tools" id="tools"></div>
    <div class="foot">
      <span class="hint">点击工具打开 · <b>悬停 Dock 查看常用</b> · 拖拽可排序</span>
      <span class="hint" id="count">18 个工具</span>
    </div>
  </div>
</div>

<!-- Dock -->
<div class="dock" id="dock"></div>

<!-- 启动器弹窗 -->
<div class="launch" id="launch">
  <div class="card">
    <div class="l-head">
      <div class="l-ic" id="lIco"></div>
      <div><h2 id="lTitle"></h2><div class="l-sub" id="lSub"></div></div>
      <button class="l-x" id="lX">✕</button>
    </div>
    <div class="l-body" id="lBody"></div>
  </div>
</div>

  disk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 8v4"/></svg>',
};
const CATS=[['all','全部'],['dev','开发'],['text','文本'],['image','图片'],['net','网络'],['sys','系统']];
const TOOLS=[
  {id:'json',name:'JSON 格式化',cat:'dev',icon:'json',desc:'格式化、校验、压缩 JSON，错误定位行号。'},
  {id:'ts',name:'时间戳转换',cat:'dev',icon:'ts',desc:'Unix 时间戳与日期互转，毫秒级。'},
  {id:'b64',name:'Base64 编解码',cat:'dev',icon:'b64',desc:'文本 / 文件 Base64 互转，支持中文。'},
  {id:'regex',name:'正则测试',cat:'dev',icon:'regex',desc:'实时匹配高亮，常用表达式速查。'},
  {id:'url',name:'URL 编解码',cat:'dev',icon:'url',desc:'URL 参数编解码，支持选区处理。'},
  {id:'hash',name:'哈希计算',cat:'dev',icon:'hash',desc:'MD5 / SHA 系列，支持文件拖入。'},
  {id:'stat',name:'字符统计',cat:'text',icon:'stat',desc:'字数、行数、词数实时统计。'},
  {id:'diff',name:'文本对比',cat:'text',icon:'diff',desc:'左右分栏 Diff 对比高亮。'},
  {id:'md',name:'Markdown 预览',cat:'text',icon:'md',desc:'实时渲染 GFM，目录生成。'},
  {id:'trans',name:'快捷翻译',cat:'text',icon:'trans',desc:'多引擎翻译，划词即译。'},
  {id:'color',name:'颜色选择器',cat:'image',icon:'color',desc:'取色与 HEX/RGB/HSL 互转。'},
  {id:'qr',name:'二维码生成',cat:'image',icon:'qr',desc:'链接 / WiFi 一键生成二维码。'},
  {id:'img',name:'图片压缩',cat:'image',icon:'img',desc:'本地压缩，质量可调，前后对比。'},
  {id:'pip',name:'屏幕取色',cat:'image',icon:'pip',desc:'放大镜取色，一键复制 HEX。'},
  {id:'unit',name:'单位换算',cat:'net',icon:'unit',desc:'长度、重量、温度等常用换算。'},
  {id:'fx',name:'汇率换算',cat:'net',icon:'fx',desc:'常用币种实时汇率。'},
  {id:'pw',name:'随机密码',cat:'sys',icon:'pw',desc:'按规则生成高强度密码。'},
  {id:'clip',name:'剪贴板历史',cat:'sys',icon:'clip',desc:'本地剪贴板记录。'},
  {id:'timer',name:'番茄钟',cat:'sys',icon:'timer',desc:'专注计时与休息提醒。'},
  {id:'rename',name:'批量重命名',cat:'sys',icon:'rename',desc:'按规则批量重命名文件。'},
  {id:'disk',name:'磁盘分析',cat:'sys',icon:'disk',desc:'空间占用可视化扫描。'},
];
const HOT=['json','b64','qr','color','pw'];
let favs=new Set(['json','pw','qr','ts','md']);
let cur='all',query='';
const toolsEl=document.getElementById('tools'),tabsEl=document.getElementById('tabs');

function visible(){
  return TOOLS.filter(t=>{
    const okCat=cur==='all'||t.cat===cur;
    const s=query.trim().toLowerCase();
    const okQ=!s||t.name.toLowerCase().includes(s)||t.desc.toLowerCase().includes(s)||t.id.includes(s);
    return okCat&&okQ;
  });
}
function renderTabs(){
  tabsEl.innerHTML=CATS.map(([id,n])=>`<span class="tab ${id===cur?'on':''}" data-t="${id}">${n}</span>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cur=t.dataset.t;renderTabs();renderTools();});
}
function renderTools(){
  const list=visible();
  document.getElementById('count').textContent=`${list.length} 个工具`;
  if(!list.length){
    toolsEl.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--ink3);padding:44px 0;font-size:13px">未找到匹配 “${query}” 的工具</div>`;
    return;
  }
  toolsEl.innerHTML=list.map(t=>`
    <div class="tool ${favs.has(t.id)?'fav':''}" data-id="${t.id}">
      ${HOT.includes(t.id)?'<span class="t-hot">HOT</span>':''}
      <div class="t-ic">${ICONS[t.icon]}</div>
      <div class="t-nm">${t.name}</div>
    </div>`).join('');
  toolsEl.querySelectorAll('.tool').forEach(el=>el.onclick=()=>launch(el.dataset.id));
}
function renderDock(){
  const dock=document.getElementById('dock');
  const arr=TOOLS.filter(t=>favs.has(t.id)).concat(TOOLS.filter(t=>!favs.has(t.id)).slice(0,4));
  dock.innerHTML=arr.slice(0,8).map(t=>`
    <div class="d-item" data-id="${t.id}">
      ${ICONS[t.icon]}
      <span class="d-tip">${t.name}</span>
    </div>`).join('')
    +'<span class="sep"></span>'
    +`<div class="d-item" title="全部工具" onclick="document.getElementById('q').focus()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
        <span class="d-tip">搜索</span>
      </div>`;
  dock.querySelectorAll('.d-item[data-id]').forEach(el=>el.onclick=()=>launch(el.dataset.id));
}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;renderTools();});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('q').focus();document.getElementById('q').select();}
  if(e.key==='Escape')document.getElementById('launch').classList.remove('show');
});

/* 启动器 */
const launchEl=document.getElementById('launch');
function launch(id){
  const t=TOOLS.find(x=>x.id===id);
  document.getElementById('lIco').innerHTML=ICONS[t.icon];
  document.getElementById('lTitle').textContent=t.name;
  document.getElementById('lSub').textContent=t.desc;
  document.getElementById('lBody').innerHTML=bodyHTML(id);
  launchEl.classList.add('show');
  const inp=launchEl.querySelector('input,textarea');if(inp)setTimeout(()=>inp.focus(),60);
}
document.getElementById('lX').onclick=()=>launchEl.classList.remove('show');
launchEl.onclick=e=>{if(e.target===launchEl)launchEl.classList.remove('show');};
function bodyHTML(id){
  if(id==='b64'){
    return `
      <textarea id="in" spellcheck="false">你好，GlassBox 工具箱 🚀</textarea>
      <div class="l-row">
        <button class="l-btn primary" onclick="conv(1)">编码</button>
        <button class="l-btn" onclick="conv(0)">解码</button>
      </div>
      <div class="l-out" id="out"></div>`;
  }
  if(id==='ts'){
    return `
      <input type="text" id="in" value="${Math.floor(Date.now()/1000)}" spellcheck="false">
      <div class="l-row"><button class="l-btn primary" onclick="convTs()">转换</button></div>
      <div class="l-out" id="out"></div>`;
  }
  return `
    <div class="l-out" style="color:var(--ink2)">「${TOOLS.find(x=>x.id===id).name}」为概念演示。\n\n正式实现将在此处提供完整的交互工具界面。</div>`;
}
window.conv=function(enc){
  const v=document.getElementById('in').value,out=document.getElementById('out');
  try{
    if(enc){const bytes=new TextEncoder().encode(v);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));out.textContent=btoa(bin);}
    else{const bin=atob(v.trim());const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));out.textContent=new TextDecoder().decode(bytes);}
    out.classList.remove('err');
  }catch(e){out.textContent='处理失败：'+e.message;out.classList.add('err');}
};
window.convTs=function(){
  const v=document.getElementById('in').value.trim(),out=document.getElementById('out');
  let ms=Number(v);
  if(!v||isNaN(ms)){out.textContent='请输入有效数字';out.classList.add('err');return;}
  if(ms<1e12)ms*=1000;
  const d=new Date(ms);
  out.textContent=`标准时间 : ${d.toLocaleString('zh-CN',{hour12:false})}\nUTC 时间 : ${d.toUTCString()}\n毫秒 : ${d.getTime()}\n秒级 : ${Math.floor(d.getTime()/1000)}`;
  out.classList.remove('err');
};

/* 时钟 */
function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent=n.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
}
tick();setInterval(tick,1000);

renderTabs();renderTools();renderDock();
</script>
</body>
</html>
