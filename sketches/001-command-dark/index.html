<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToolBox · 命令优先（深色紧凑）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --bg2:#0e1219; --panel:#121722; --panel2:#161c29;
    --border:#1e2636; --border2:#2a3548;
    --ink:#e6edf3; --ink2:#9aa7b8; --ink3:#5c6a7d;
    --accent:#2dd4bf; --accent-ink:#06201c; --accent-soft:rgba(45,212,191,.12);
    --danger:#f87171;
    --radius:10px; --radius-sm:8px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    display:grid; place-items:center; padding:28px;
    background-image:radial-gradient(900px 500px at 15% -10%, rgba(45,212,191,.07), transparent 60%),
                     radial-gradient(800px 500px at 110% 110%, rgba(59,130,246,.06), transparent 60%);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ---- desktop window ---- */
  .app{
    width:min(1320px,100%); height:min(860px,calc(100vh - 56px));
    background:var(--bg2); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .titlebar{
    height:46px; flex:none; display:flex; align-items:center; gap:12px;
    padding:0 14px; background:var(--panel); border-bottom:1px solid var(--border);
    -webkit-app-region:drag; user-select:none;
  }
  .titlebar .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .titlebar .dot.r{background:#f76c5e}.titlebar .dot.y{background:#f7c948}.titlebar .dot.g{background:#4cd97b}
  .titlebar .appname{font-size:13px;font-weight:600;letter-spacing:.02em;margin-left:4px}
  .titlebar .appname b{color:var(--accent)}
  .titlebar .spacer{flex:1}
  .titlebar .winbtn{width:34px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);cursor:pointer;font-size:12px}
  .titlebar .winbtn:hover{background:var(--border);color:var(--ink)}
  .titlebar .winbtn.close:hover{background:#e5484d;color:#fff}

  .body{flex:1;display:flex;min-height:0}

  /* ---- left icon rail ---- */
  .rail{
    width:64px; flex:none; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:4px;
  }
  .logo{
    width:38px;height:38px;border-radius:10px;margin-bottom:10px;flex:none;
    background:linear-gradient(135deg,#2dd4bf,#0ea5e9);display:grid;place-items:center;
    font-weight:700;font-size:16px;color:#052019;box-shadow:0 4px 14px rgba(45,212,191,.35);
  }
  .rail .rbtn{
    width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
    color:var(--ink3);cursor:pointer;position:relative;transition:background .15s,color .15s;
  }
  .rail .rbtn svg{width:21px;height:21px}
  .rail .rbtn:hover{background:var(--border);color:var(--ink)}
  .rail .rbtn.active{background:var(--accent-soft);color:var(--accent)}
  .rail .rbtn.active::before{content:"";position:absolute;left:-13px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--accent)}
  .rail .rbtn .tip{
    position:absolute;left:56px;top:50%;transform:translateY(-50%) scale(.96);opacity:0;
    background:#1c2331;border:1px solid var(--border2);color:var(--ink);font-size:12px;
    padding:5px 10px;border-radius:7px;white-space:nowrap;pointer-events:none;transition:opacity .12s,transform .12s;z-index:50;
  }
  .rail .rbtn:hover .tip{opacity:1;transform:translateY(-50%) scale(1)}
  .rail .spacer{flex:1}

  /* ---- main ---- */
  main{flex:1;display:flex;flex-direction:column;min-width:0;padding:22px 26px 18px}
  .searchwrap{position:relative;flex:none}
  .searchbar{
    width:100%;height:50px;display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:0 16px;
    transition:border-color .15s, box-shadow .15s;
  }
  .searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbar svg{width:19px;height:19px;color:var(--ink3);flex:none}
  .searchbar input{
    flex:1;background:none;border:none;outline:none;color:var(--ink);
    font-family:var(--mono);font-size:14.5px;letter-spacing:.01em;
  }
  .searchbar input::placeholder{color:var(--ink3)}
  .searchbar kbd{
    flex:none;font-family:var(--mono);font-size:11px;color:var(--ink2);
    background:var(--bg2);border:1px solid var(--border2);border-bottom-width:2px;
    padding:3px 8px;border-radius:6px;
  }
  .chips{display:flex;gap:8px;margin:16px 0 14px;flex:none;flex-wrap:wrap}
  .chip{
    padding:6px 14px;border-radius:999px;font-size:12.5px;color:var(--ink2);
    background:var(--panel);border:1px solid var(--border);cursor:pointer;user-select:none;
    transition:all .15s;display:flex;align-items:center;gap:7px;
  }
  .chip .n{font-size:11px;color:var(--ink3);font-family:var(--mono)}
  .chip:hover{color:var(--ink);border-color:var(--border2)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip.active .n{color:var(--accent)}

  .gridhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .gridhead h2{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.04em}
  .gridhead .count{font-size:12px;color:var(--ink3);font-family:var(--mono)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;overflow-y:auto;padding:2px 4px 10px 2px}
  .grid::-webkit-scrollbar{width:8px}.grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
  .tile{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;
    cursor:pointer;user-select:none;transition:border-color .15s,background .15s,transform .15s;
  }
  .tile:hover{transform:translateY(-2px);border-color:var(--border2);background:var(--panel2)}
  .tile.sel{border-color:var(--accent);background:var(--accent-soft)}
  .tile .ic{
    width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
    background:var(--bg2);border:1px solid var(--border);color:var(--ink2);transition:all .15s;
  }
  .tile .ic svg{width:21px;height:21px}
  .tile:hover .ic{color:var(--accent);border-color:var(--accent)}
  .tile.sel .ic{color:var(--accent);border-color:var(--accent)}
  .tile .nm{font-size:12px;color:var(--ink);text-align:center;line-height:1.25}
  .tile .hot{font-size:10px;color:var(--ink3);font-family:var(--mono)}
  .tile.fav::after{content:"★";position:absolute;top:6px;right:9px;font-size:10px;color:var(--accent)}
  .tile{position:relative}
  .empty{
    grid-column:1/-1;text-align:center;color:var(--ink3);padding:60px 0;font-size:13.5px;
  }
  .empty b{color:var(--ink2)}

  /* ---- inspector ---- */
  .inspector{
    width:330px;flex:none;background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  .insp-head{padding:18px 20px 0}
  .insp-ico{width:52px;height:52px;border-radius:13px;background:var(--accent-soft);border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent)}
  .insp-ico svg{width:26px;height:26px}
  .insp-title{margin-top:14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .insp-title .favstar{cursor:pointer;font-size:15px;color:var(--ink3)}
  .insp-title .favstar.on{color:#f7c948}
  .insp-desc{margin-top:6px;font-size:12.5px;color:var(--ink2);line-height:1.6}
  .insp-meta{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);color:var(--ink2)}
  .tag.cat{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .tag.kbd{font-family:var(--mono)}
  .insp-actions{display:flex;gap:8px;margin-top:16px}
  .btn{
    flex:1;height:36px;border-radius:9px;border:1px solid var(--border2);background:var(--panel2);
    color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);
    display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;
  }
  .btn svg{width:15px;height:15px}
  .btn:hover{background:var(--border);border-color:var(--border2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.08)}

  .demo{margin:20px 20px 0;border-top:1px dashed var(--border2);padding-top:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .demo h4{font-size:11px;letter-spacing:.12em;color:var(--ink3);font-weight:600}
  .demo textarea,.demo input[type=text]{
    width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:9px 11px;outline:none;resize:vertical;min-height:70px;
    transition:border-color .15s;
  }
  .demo input[type=text]{min-height:0;height:34px}
  .demo textarea:focus,.demo input[type=text]:focus{border-color:var(--accent)}
  .demo .row{display:flex;gap:8px}
  .demo .row .btn{flex:none;padding:0 13px}
  .demo .out{
    background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;
    font-family:var(--mono);font-size:12px;color:var(--accent);white-space:pre-wrap;word-break:break-all;
    max-height:190px;overflow:auto;line-height:1.55;
  }
  .demo .out.err{color:var(--danger)}
  .demo label{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .demo .opts{display:flex;gap:12px;flex-wrap:wrap}
  .demo input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
  .demo input[type=range]{accent-color:var(--accent);flex:1}

  .insp-welcome{display:none}
  .insp-welcome.show{display:block}
  .insp-welcome .tipbox{
    margin:20px 20px 0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;
  }
  .insp-welcome .tipbox h4{font-size:11px;letter-spacing:.12em;color:var(--ink3);margin-bottom:12px;font-weight:600}
  .insp-welcome .tiprow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12.5px;color:var(--ink2)}
  .insp-welcome .tiprow kbd{
    font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--border2);border-bottom-width:2px;
    padding:2px 7px;border-radius:5px;color:var(--ink);
  }
  .insp-welcome .brand{text-align:center;padding:26px 20px 10px;color:var(--ink3);font-size:12px;line-height:1.7}

  @media (max-width:1080px){ .inspector{width:280px} }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div class="app">
  <!-- 窗口标题栏 -->
  <header class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="appname">Tool<b>Box</b> · 工具箱</span>
    <span class="spacer"></span>
    <span class="winbtn" title="最小化">—</span>
    <span class="winbtn" title="最大化">□</span>
    <span class="winbtn close" title="关闭">✕</span>
  </header>

  <div class="body">
    <!-- 左侧图标栏 -->
    <aside class="rail">
      <div class="logo">T</div>
      <div class="rbtn active" data-cat="all"><span class="tip">全部工具</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </div>
      <div class="rbtn" data-cat="dev"><span class="tip">开发工具</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H8"/><path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H16"/><path d="M9 9l-2.5 3L9 15M15 9l2.5 3L15 15"/></svg>
      </div>
      <div class="rbtn" data-cat="text"><span class="tip">文本处理</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 10h9M5 14h14M5 18h9"/></svg>
      </div>
      <div class="rbtn" data-cat="image"><span class="tip">图片工具</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M4 17l5-4 3.5 3 3.5-3.5L20 17"/></svg>
      </div>
      <div class="rbtn" data-cat="net"><span class="tip">网络工具</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9z"/></svg>
      </div>
      <div class="rbtn" data-cat="sys"><span class="tip">系统工具</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </div>
      <span class="spacer"></span>
      <div class="rbtn" title="设置"><span class="tip">设置</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></svg>
      </div>
    </aside>

    <!-- 主区 -->
    <main>
      <div class="searchwrap">
        <div class="searchbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
          <input id="search" type="text" placeholder="搜索工具、输入命令… 试试输入 “json”" spellcheck="false">
          <kbd>Ctrl K</kbd>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="gridhead">
        <h2 id="gridTitle">全部工具</h2><span class="count" id="gridCount"></span>
      </div>
      <div class="grid" id="grid"></div>
    </main>

    <!-- 右侧检查器 -->
    <aside class="inspector">
      <div class="insp-welcome show" id="welcome">
        <div class="tipbox">
          <h4>快捷键</h4>
          <div class="tiprow"><span>全局唤起 / 搜索</span><kbd>Ctrl K</kbd></div>
          <div class="tiprow"><span>快速打开面板</span><kbd>Ctrl Space</kbd></div>
          <div class="tiprow"><span>固定在常用</span><kbd>Ctrl D</kbd></div>
          <div class="tiprow"><span>呼出设置</span><kbd>Ctrl ,</kbd></div>
          <div class="tiprow"><span>粘贴剪贴板内容</span><kbd>Ctrl V</kbd></div>
        </div>
        <div class="brand">点击左侧任意工具<br>查看详情与在线演示</div>
      </div>

      <div class="insp-body" id="insp" style="display:none">
        <div class="insp-head">
          <div class="insp-ico" id="inspIco"></div>
          <div class="insp-title"><span id="inspName"></span><span class="favstar" id="inspStar" title="固定到常用">☆</span></div>
          <div class="insp-desc" id="inspDesc"></div>
          <div class="insp-meta">
            <span class="tag cat" id="inspCat"></span>
            <span class="tag kbd" id="inspHot"></span>
          </div>
          <div class="insp-actions">
            <button class="btn primary" id="runBtn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>打开工具
            </button>
            <button class="btn" id="pinBtn">☆ 固定</button>
          </div>
        </div>
        <div class="demo" id="demo"></div>
      </div>
    </aside>
  </div>
</div>

<script>
/* ============ 工具数据 ============ */
const I = {
  json:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5H6a2 2 0 0 0-2 2V8c0 1.4-1 2.3-2 2.6 1 .3 2 1.2 2 2.6v2.8a2 2 0 0 0 2 2h2.5"/><path d="M15.5 3.5H18a2 2 0 0 1 2 2V8c0 1.4 1 2.3 2 2.6-1 .3-2 1.2-2 2.6v2.8a2 2 0 0 1-2 2h-2.5"/></svg>',

  regex:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14"/><circle cx="8.2" cy="15.8" r="1.7"/><circle cx="15.8" cy="8.2" r="1.7"/></svg>',
  b64:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12M13 4l3 3-3 3M20 17H8M11 14l-3 3 3 3"/></svg>',
  url:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4L11.8 6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.4"/></svg>',
  hash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 4 7 20M17 4l-2 16M4 9h16M3 15h16"/></svg>',
  pw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.2"/><path d="M11.2 11.8 20 3M16 7l3 3M13.5 9.5l2 2"/></svg>',
  color:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg>',

const CATS = [
  {id:'all',name:'全部'},
  {id:'dev',name:'开发'},
  {id:'text',name:'文本'},
  {id:'image',name:'图片'},
  {id:'net',name:'网络'},
  {id:'sys',name:'系统'},
];
const TOOLS = [
  {id:'json',  name:'JSON 格式化', cat:'dev',  icon:'json',  hot:'Ctrl 1', desc:'格式化、校验、压缩 JSON 数据，支持一键复制与错误定位。'},
  {id:'ts',    name:'时间戳转换', cat:'dev',  icon:'ts',    hot:'Ctrl 2', desc:'Unix 时间戳与日期时间互转，支持毫秒级与相对时间显示。'},
  {id:'b64',   name:'Base64 编解码', cat:'dev', icon:'b64', hot:'',      desc:'文本与文件的 Base64 编码 / 解码，完美支持中文与 Unicode。'},
  {id:'regex', name:'正则测试',   cat:'dev',  icon:'regex', hot:'',      desc:'实时匹配正则表达式，高亮命中结果，附常用表达式速查。'},
  {id:'url',   name:'URL 编解码', cat:'dev',  icon:'url',   hot:'',      desc:'URL 参数与路径的编码、解码，支持整段或选区处理。'},

  {id:'stat',  name:'字符统计',   cat:'text', icon:'stat',  hot:'',      desc:'字数、行数、词数、字节数实时统计，中英文混合精确。'},

  {id:'img',   name:'图片压缩',   cat:'image',icon:'img',   hot:'',      desc:'本地压缩图片，可调质量与尺寸，压缩后实时预览对比。'},
  {id:'pip',   name:'屏幕取色',   cat:'image',icon:'pip',   hot:'',      desc:'放大镜取色，自动复制 HEX 值，支持历史色板。'},
  {id:'unit',  name:'单位换算',   cat:'sys',  icon:'unit',  hot:'',      desc:'长度、重量、温度、面积、体积等常用单位一键换算。'},
  {id:'fx',    name:'汇率换算',   cat:'net',  icon:'fx',    hot:'',      desc:'常用币种实时汇率换算，支持离线缓存最近汇率。'},
  {id:'trans', name:'快捷翻译',   cat:'text', icon:'trans', hot:'',      desc:'多引擎翻译，划词即译，支持 40+ 语言与朗读。'},
  {id:'clip',  name:'剪贴板历史', cat:'sys',  icon:'clip',  hot:'',      desc:'本地剪贴板记录，支持文本 / 图片 / 文件，按需固定。'},
  {id:'timer', name:'番茄钟',     cat:'sys',  icon:'timer', hot:'',      desc:'专注计时与休息提醒，支持自定义时长与通知。'},
  {id:'rename',name:'批量重命名', cat:'sys',  icon:'rename',hot:'',      desc:'按序号、日期、规则批量重命名文件，实时预览结果。'},
  {id:'disk',  name:'磁盘分析',   cat:'sys',  icon:'disk',  hot:'',      desc:'扫描磁盘空间占用，可视化大文件分布，快速定位清理。'},
];
let favs = new Set(['json','pw','qr']);
let curCat='all', curSel=null, query='';

/* ============ 渲染 ============ */
const grid=document.getElementById('grid'), chips=document.getElementById('chips');
const search=document.getElementById('search');
const CAT_NAMES={dev:'开发工具',text:'文本处理',image:'图片工具',net:'网络工具',sys:'系统工具',all:'全部工具'};

function visible(){
  return TOOLS.filter(t=>{
    const okCat=curCat==='all'||t.cat===curCat;
    const q=query.trim().toLowerCase();
    const okQ=!q||t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q)||t.id.includes(q);
    return okCat&&okQ;
  });
}
function renderChips(){
  chips.innerHTML=CATS.map(c=>{
    const n=c.id==='all'?TOOLS.length:TOOLS.filter(t=>t.cat===c.id).length;
    return `<div class="chip ${c.id===curCat?'active':''}" data-cat="${c.id}">${c.name}<span class="n">${n}</span></div>`;
  }).join('');
  chips.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{curCat=ch.dataset.cat;renderChips();renderGrid();syncRail();});
}
function renderGrid(){
  const list=visible();
  document.getElementById('gridTitle').textContent=CAT_NAMES[curCat];
  document.getElementById('gridCount').textContent=`${list.length} / ${TOOLS.length}`;
  if(!list.length){
    grid.innerHTML=`<div class="empty">没有找到匹配的工具<br><b>“${query}”</b>，换个关键词试试？</div>`;
    return;
  }
  grid.innerHTML=list.map(t=>`
    <div class="tile ${t.id===curSel?'sel':''} ${favs.has(t.id)?'fav':''}" data-id="${t.id}">
      <div class="ic">${I[t.icon]}</div>
      <div class="nm">${t.name}</div>
      ${t.hot?`<div class="hot">${t.hot}</div>`:''}
    </div>`).join('');
  grid.querySelectorAll('.tile').forEach(el=>{
    el.onclick=()=>selectTool(el.dataset.id);
    el.ondblclick=()=>{selectTool(el.dataset.id);openDemo();};
  });
}
function syncRail(){
  document.querySelectorAll('.rail .rbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat===curCat);
  });
}
/* 工具栏按钮映射到分类（rail 上按钮的 data-cat 与 chips 一致） */
document.querySelectorAll('.rail .rbtn[data-cat]').forEach(b=>{
  b.onclick=()=>{curCat=b.dataset.cat;renderChips();renderGrid();syncRail();};
});

/* ============ 检查器 ============ */
function selectTool(id){
  curSel=id; renderGrid();
  const t=TOOLS.find(x=>x.id===id);
  document.getElementById('welcome').classList.remove('show');
  const insp=document.getElementById('insp'); insp.style.display='flex'; insp.style.flexDirection='column';
  document.getElementById('inspIco').innerHTML=I[t.icon];
  document.getElementById('inspName').textContent=t.name;
  document.getElementById('inspDesc').textContent=t.desc;
  document.getElementById('inspCat').textContent=CAT_NAMES[t.cat];
  document.getElementById('inspHot').textContent=t.hot||'无快捷键';
  const star=document.getElementById('inspStar');
  star.textContent=favs.has(id)?'★':'☆';
  star.classList.toggle('on',favs.has(id));
  document.getElementById('pinBtn').textContent=favs.has(id)?'★ 已固定':'☆ 固定';
  renderDemo(t);
}
function openDemo(){ /* 打开工具按钮：滚动到演示区并聚焦 */ 
  const d=document.getElementById('demo'); if(d) d.scrollIntoView({behavior:'smooth',block:'nearest'});
  const ta=d.querySelector('textarea,input[type=text]'); if(ta) ta.focus();
}
document.getElementById('runBtn').onclick=openDemo;
document.getElementById('pinBtn').onclick=()=>{
  if(!curSel)return;
  favs.has(curSel)?favs.delete(curSel):favs.add(curSel);
  selectTool(curSel); renderGrid();
};
document.getElementById('inspStar').onclick=document.getElementById('pinBtn').onclick;

/* ============ 在线演示 ============ */
function renderDemo(t){
  const d=document.getElementById('demo');
  const demo={
    json:`
      <h4>在线演示 · JSON 格式化</h4>
      <textarea id="djson" spellcheck="false">{"name":"工具箱","version":"0.1.0","tags":["开发","效率"],"active":true,"count":128}</textarea>
      <div class="row">
        <button class="btn primary" onclick="fmtJson(1)">格式化</button>
        <button class="btn" onclick="fmtJson(0)">压缩</button>
        <button class="btn" onclick="document.getElementById('djson').value='';">清空</button>
      </div>
      <div class="out" id="ojson"></div>`,
    ts:`
      <h4>在线演示 · 时间戳转换</h4>
      <input type="text" id="dts" value="1754131200" spellcheck="false">
      <div class="row"><button class="btn primary" onclick="fmtTs()">转换</button></div>
      <div class="out" id="ots"></div>`,
    b64:`
      <h4>在线演示 · Base64 编解码</h4>
      <textarea id="db64" spellcheck="false">你好，工具箱 Hello ToolBox 🚀</textarea>
      <div class="row">
        <button class="btn primary" onclick="fmtB64(1)">编码</button>
        <button class="btn" onclick="fmtB64(0)">解码</button>
      </div>
      <div class="out" id="ob64"></div>`,
    pw:`
      <h4>在线演示 · 随机密码</h4>
      <div class="opts">
        <label><input type="checkbox" id="pwU" checked>大写</label>
        <label><input type="checkbox" id="pwL" checked>小写</label>
        <label><input type="checkbox" id="pwD" checked>数字</label>
        <label><input type="checkbox" id="pwS" checked>符号</label>
      </div>
      <div class="row" style="align-items:center">
        <input type="range" id="pwLen" min="6" max="32" value="16" style="flex:1">
        <span id="pwLenV" style="font-family:var(--mono);font-size:12px;color:var(--ink2)">16</span>
      </div>
      <div class="row">
        <button class="btn primary" onclick="genPw()">生成</button>
        <button class="btn" onclick="copyPw()">复制</button>
      </div>
      <div class="out" id="opw"></div>`,
  }[t.id] || `
    <h4>该工具为概念演示</h4>
    <div class="out" style="color:var(--ink2)">${t.desc}\n\n此原型仅演示交互框架，实际功能将在正式开发中实现。</div>`;
  d.innerHTML=demo;
  if(t.id==='ts'){ /* 默认填充当前时间戳 */
    const el=document.getElementById('dts'); if(el&&!el.value) el.value=Math.floor(Date.now()/1000);
  }
}
/* 演示逻辑 */
window.fmtJson=function(pretty){
  const ta=document.getElementById('djson'), out=document.getElementById('ojson');
  try{
    const v=JSON.parse(ta.value);
    out.textContent=pretty?JSON.stringify(v,null,2):JSON.stringify(v);
    out.classList.remove('err');
  }catch(e){out.textContent='解析失败：'+e.message;out.classList.add('err');}
};
window.fmtTs=function(){
  const v=document.getElementById('dts').value.trim(), out=document.getElementById('ots');
  let ms=Number(v); if(!v||isNaN(ms)){out.textContent='请输入有效的数字时间戳';out.classList.add('err');return;}
  if(ms<1e12)ms*=1000;
  const d=new Date(ms);
  out.textContent=`标准时间 : ${d.toLocaleString('zh-CN',{hour12:false})}\nUTC 时间 : ${d.toUTCString()}\n毫秒时间戳 : ${d.getTime()}\n秒级时间戳 : ${Math.floor(d.getTime()/1000)}\n相对时间 : ${rel(d)}`;
  out.classList.remove('err');
};
function rel(d){const s=(Date.now()-d.getTime())/1000;
  if(s<-3600*24*30)return '未来';
  if(Math.abs(s)<60)return '刚刚';
  if(Math.abs(s)<3600)return `${Math.round(s/60)} 分钟${s>0?'前':'后'}`;
  if(Math.abs(s)<86400)return `${Math.round(s/3600)} 小时${s>0?'前':'后'}`;
  return `${Math.round(s/86400)} 天${s>0?'前':'后'}`;}
window.fmtB64=function(enc){
  const ta=document.getElementById('db64'), out=document.getElementById('ob64');
  try{
    if(enc){
      const bytes=new TextEncoder().encode(ta.value);
      let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
      out.textContent=btoa(bin);
    }else{
      const bin=atob(ta.value.trim());
      const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
      out.textContent=new TextDecoder().decode(bytes);
    }
    out.classList.remove('err');
  }catch(e){out.textContent='处理失败：'+e.message;out.classList.add('err');}
};
window.genPw=function(){
  const len=+document.getElementById('pwLen').value;
  const sets=['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnopqrstuvwxyz','23456789','!@#$%^&*()-_=+'];
  const picks=[document.getElementById('pwU').checked,document.getElementById('pwL').checked,document.getElementById('pwD').checked,document.getElementById('pwS').checked];
  let pool='',out='';
  picks.forEach((p,i)=>{if(p){pool+=sets[i];out+=sets[i][Math.floor(Math.random()*sets[i].length)];}});
  if(!pool){out='请至少选择一种字符集';}
  while(out.length<len)out+=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('opw').textContent=out;
  document.getElementById('opw').classList.remove('err');
};
window.copyPw=function(){
  const t=document.getElementById('opw').textContent;
  if(t&&navigator.clipboard){navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('opw');b.textContent='已复制到剪贴板 ✓';setTimeout(()=>genPw(),900);});}
};
document.getElementById('pwLen')&&document.getElementById('pwLen').addEventListener('input',e=>{const v=document.getElementById('pwLenV');if(v)v.textContent=e.target.value;});

/* ============ 搜索 ============ */
search.addEventListener('input',e=>{query=e.target.value;renderGrid();});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const l=visible();if(l.length)selectTool(l[0].id);}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus();search.select();}
});

/* ============ 初始化 ============ */
renderChips(); renderGrid();
</script>
