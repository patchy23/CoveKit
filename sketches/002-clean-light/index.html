<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToolKit · 内容优先（明净浅色）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#fafbfc;
    --border:#e5e8ec; --border2:#d3d8de;
    --ink:#191d23; --ink2:#5c6672; --ink3:#98a2ad;
    --accent:#f0562c; --accent-ink:#fff; --accent-soft:#fdeee7;
    --green:#12b76a; --green-soft:#e7f8f0;
    --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
    --shadow-lg:0 12px 40px rgba(16,24,40,.14);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0f1216; --panel:#161b21; --panel2:#1b2129;
    --border:#232a34; --border2:#303946;
    --ink:#e8edf2; --ink2:#9aa7b5; --ink3:#66727f;
    --accent:#ff7a4d; --accent-soft:#3a2116;
    --green:#34d399; --green-soft:#0f2e22;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    display:grid; place-items:center; padding:28px;
    -webkit-font-smoothing:antialiased;
    transition:background .25s,color .25s;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* 窗口 */
  .app{
    width:min(1360px,100%); height:min(880px,calc(100vh - 56px));
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow-lg); display:flex; overflow:hidden;
  }
  /* 侧边栏 */
  .sidebar{
    width:236px; flex:none; background:var(--panel2); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 14px 16px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px;margin-bottom:22px}
  .brand .logo{
    width:36px;height:36px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,#f0562c,#ff8a3d);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
    box-shadow:0 4px 12px rgba(240,86,44,.35);
  }
  .brand .name{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .brand .name small{display:block;font-size:10.5px;font-weight:500;color:var(--ink3);letter-spacing:.06em;margin-top:1px}

  .nav-label{font-size:10.5px;font-weight:600;color:var(--ink3);letter-spacing:.1em;padding:0 10px;margin:14px 0 6px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
    color:var(--ink2);font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer;
    transition:background .13s,color .13s;
  }
  .nav a svg{width:17px;height:17px;flex:none;color:var(--ink3)}
  .nav a:hover{background:var(--border);color:var(--ink)}
  .nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav a.active svg{color:var(--accent)}
  .nav a .cnt{margin-left:auto;font-size:11px;color:var(--ink3);background:var(--border);padding:1px 7px;border-radius:999px;font-weight:600}
  .nav a.active .cnt{background:var(--accent);color:var(--accent-ink)}
  .sidebar .spacer{flex:1}
  .sidebar .foot{display:flex;flex-direction:column;gap:2px}
  .sidebar .foot a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink2);font-size:13px;cursor:pointer;text-decoration:none}
  .sidebar .foot a:hover{background:var(--border);color:var(--ink)}
  .sidebar .foot a svg{width:16px;height:16px;color:var(--ink3)}

  /* 主区 */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{
    height:66px;flex:none;display:flex;align-items:center;gap:14px;
    padding:0 26px;border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .topbar .sub{font-size:12px;color:var(--ink3);margin-top:1px}
  .topbar .spacer{flex:1}
  .searchbox{
    display:flex;align-items:center;gap:8px;width:280px;height:38px;
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0 12px;
    transition:border-color .15s,box-shadow .15s,width .2s;
  }
  .searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);width:320px}
  .searchbox svg{width:15px;height:15px;color:var(--ink3);flex:none}
  .searchbox input{flex:1;border:none;outline:none;background:none;font-family:var(--sans);font-size:13px;color:var(--ink)}
  .searchbox input::placeholder{color:var(--ink3)}
  .iconbtn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
    display:grid;place-items:center;color:var(--ink2);cursor:pointer;transition:all .15s;flex:none;
  }
  .iconbtn:hover{border-color:var(--border2);color:var(--ink);background:var(--panel2)}
  .iconbtn svg{width:17px;height:17px}
  .iconbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .iconbtn.primary:hover{filter:brightness(1.06);color:#fff}

  .content{flex:1;overflow-y:auto;padding:22px 26px 30px}
  .content::-webkit-scrollbar{width:9px}
  .content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px;border:2px solid var(--panel)}

  /* 最近使用 */
  .recent{
    background:linear-gradient(135deg,var(--accent-soft),var(--panel));
    border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .recent .rl{font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px;margin-right:4px}
  .recent .rl svg{width:15px;height:15px;color:var(--accent)}
  .recent .rchip{
    display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--ink2);
    cursor:pointer;transition:all .15s;
  }
  .recent .rchip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
  .recent .rchip svg{width:13px;height:13px}

  .sec-head{display:flex;align-items:center;margin:0 2px 12px}
  .sec-head h2{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .sec-head .spacer{flex:1}
  .sec-head .tog{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
  .sec-head .tog button{
    border:none;background:none;width:30px;height:26px;border-radius:6px;display:grid;place-items:center;
    color:var(--ink3);cursor:pointer;transition:all .13s;
  }
  .sec-head .tog button svg{width:14px;height:14px}
  .sec-head .tog button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}

  /* 工具卡片 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .16s,box-shadow .16s,border-color .16s;
  }
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0;transition:opacity .16s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border2)}
  .card:hover::after{opacity:1}
  .card .top{display:flex;align-items:flex-start;justify-content:space-between}
  .card .ic{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);
  }
  .card .ic svg{width:22px;height:22px}
  .card .star{
    border:none;background:none;color:var(--ink3);cursor:pointer;font-size:17px;line-height:1;
    padding:4px;border-radius:6px;transition:all .13s;
  }
  .card .star:hover{color:#f5a623;transform:scale(1.15)}
  .card .star.on{color:#f5a623}
  .card h3{font-size:14.5px;font-weight:700;margin-top:14px;letter-spacing:-.01em}
  .card p{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.55}
  .card .tags{display:flex;gap:6px;margin-top:13px}
  .card .tags span{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--ink3)}
  .card .tags span.hot{background:var(--green-soft);color:var(--green)}

  /* 列表视图 */
  .list{display:none;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .list .lrow{
    display:flex;align-items:center;gap:13px;padding:12px 18px;background:var(--panel);
    border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;
  }
  .list .lrow:last-child{border-bottom:none}
  .list .lrow:hover{background:var(--panel2)}
  .list .lrow .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
  .list .lrow .ic svg{width:17px;height:17px}
  .list .lrow .nm{font-size:13.5px;font-weight:600}
  .list .lrow .ds{font-size:12px;color:var(--ink2);margin-top:1px}
  .list .lrow .cat{margin-left:auto;font-size:11px;color:var(--ink3);background:var(--bg);padding:3px 9px;border-radius:999px;font-weight:500}

  /* 弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(16,20,28,.45);backdrop-filter:blur(3px);
    display:none;place-items:center;z-index:100;
  }
  .modal-mask.show{display:grid}
  .modal{
    width:min(560px,92vw);background:var(--panel);border-radius:18px;box-shadow:var(--shadow-lg);
    padding:26px;animation:pop .18s ease;
  }
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal .m-head{display:flex;align-items:center;gap:12px}
  .modal .m-ic{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .modal .m-ic svg{width:23px;height:23px}
  .modal h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .modal .m-sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
  .modal .m-close{margin-left:auto;border:none;background:var(--bg);width:32px;height:32px;border-radius:9px;color:var(--ink2);cursor:pointer;font-size:14px}
  .modal .m-close:hover{background:var(--border);color:var(--ink)}
  .demo{margin-top:20px;display:flex;flex-direction:column;gap:11px}
  .demo label{font-size:12px;font-weight:600;color:var(--ink2)}
  .demo input[type=text],.demo textarea{
    width:100%;border:1px solid var(--border2);border-radius:10px;padding:11px 13px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;color:var(--ink);
    background:var(--panel2);outline:none;transition:border-color .15s;
  }
  .demo input[type=text]:focus,.demo textarea:focus{border-color:var(--accent)}
  .demo .row{display:flex;gap:8px}
  .demo .out{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;color:var(--accent);
    white-space:pre-wrap;word-break:break-all;line-height:1.6;min-height:40px;
  }
  .btn{
    height:38px;padding:0 18px;border-radius:10px;border:1px solid var(--border2);
    background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;
    font-family:var(--sans);transition:all .15s;display:inline-flex;align-items:center;gap:7px;
  }
  .btn svg{width:15px;height:15px}
  .btn:hover{background:var(--panel2);border-color:var(--border2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.07)}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#1c2129;color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:1000px){.sidebar{width:200px}}
  @media (max-width:860px){.sidebar{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div class="name">小工具集<small>TOOLKIT</small></div>
    </div>

    <div class="nav-label">工具库</div>
    <nav class="nav">
      <a class="active" data-f="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>全部工具<span class="cnt">18</span></a>
      <a data-f="dev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6 4 12l4.5 6M15.5 6 20 12l-4.5 6"/></svg>开发工具<span class="cnt">6</span></a>
      <a data-f="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h9M5 17h14"/></svg>文本处理<span class="cnt">4</span></a>
      <a data-f="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 3.5 3 3.5-3.5L20 17"/></svg>图片工具<span class="cnt">3</span></a>
      <a data-f="net"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.8 5.3 3.8 8.5s-1.4 6.1-3.8 8.5c-2.4-2.4-3.8-5.3-3.8-8.5s1.4-6.1 3.8-8.5z"/></svg>网络工具<span class="cnt">2</span></a>
      <a data-f="sys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>系统工具<span class="cnt">3</span></a>
      <a data-f="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.5 6 .7-4.4 4.2 1.2 6L12 17l-5.4 2.9 1.2-6L3.4 9.7l6-.7z"/></svg>我的收藏<span class="cnt" id="favCnt">3</span></a>
    </nav>

    <div class="spacer"></div>
    <div class="foot">
      <a id="themeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5c-4.5 0-8.5-4-8.5-8.5z"/></svg>深色模式</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></svg>偏好设置</a>
    </div>
  </aside>

  <!-- 主区 -->
  <main>
    <div class="topbar">
      <div>
        <h1>全部工具</h1>
        <div class="sub" id="countSub">共 18 个工具 · 点击卡片即可使用</div>
      </div>
      <div class="spacer"></div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <input id="q" type="text" placeholder="搜索工具…" spellcheck="false">
      </div>
      <button class="iconbtn" title="视图切换" id="viewBtn">
        <svg id="viewIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
      </button>
      <button class="iconbtn primary" title="添加工具"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

    <div class="content">
      <div class="recent">
        <span class="rl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.2"/></svg>最近使用</span>
        <span class="rchip" data-id="json"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5H6a2 2 0 0 0-2 2V8c0 1.4-1 2.3-2 2.6 1 .3 2 1.2 2 2.6v2.8a2 2 0 0 0 2 2h2.5M15.5 3.5H18a2 2 0 0 1 2 2V8c0 1.4 1 2.3 2 2.6-1 .3-2 1.2-2 2.6v2.8a2 2 0 0 1-2 2h-2.5"/></svg>JSON 格式化</span>
        <span class="rchip" data-id="ts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.2"/></svg>时间戳转换</span>
        <span class="rchip" data-id="color"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg>颜色选择器</span>
      </div>

      <div class="sec-head">
        <h2>工具列表</h2>
        <div class="spacer"></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="list" id="list"></div>
    </div>
  </main>
</div>

<!-- 弹窗 -->
<div class="modal-mask" id="mask">
  <div class="modal">
    <div class="m-head">
      <div class="m-ic" id="mIco"></div>
      <div><h2 id="mTitle"></h2><div class="m-sub" id="mDesc"></div></div>
      <button class="m-close" id="mClose">✕</button>
    </div>
    <div class="demo" id="mDemo"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ICONS={
  json:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5H6a2 2 0 0 0-2 2V8c0 1.4-1 2.3-2 2.6 1 .3 2 1.2 2 2.6v2.8a2 2 0 0 0 2 2h2.5M15.5 3.5H18a2 2 0 0 1 2 2V8c0 1.4 1 2.3 2 2.6-1 .3-2 1.2-2 2.6v2.8a2 2 0 0 1-2 2h-2.5"/></svg>',
  ts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.2"/></svg>',

const TOOLS=[

  {id:'ts',name:'时间戳转换',cat:'dev',icon:'ts',desc:'Unix 时间戳与日期互转，支持毫秒与相对时间。',tags:['开发'],hot:false},
  {id:'b64',name:'Base64 编解码',cat:'dev',icon:'b64',desc:'文本/文件 Base64 互转，完整支持中文 Unicode。',tags:['开发'],hot:false},
  {id:'regex',name:'正则测试',cat:'dev',icon:'regex',desc:'实时匹配高亮，常用表达式一键插入。',tags:['开发'],hot:false},
  {id:'url',name:'URL 编解码',cat:'dev',icon:'url',desc:'URL 参数与路径编码解码，支持选区处理。',tags:['开发'],hot:false},

let favs=new Set(['json','pw','qr']);
let cur='all', listView=false;

const cards=document.getElementById('cards'),list=document.getElementById('list'),q=document.getElementById('q');

function filtered(){
  const s=q.value.trim().toLowerCase();
  return TOOLS.filter(t=>{
    if(cur==='fav')return favs.has(t.id);
    if(cur!=='all'&&t.cat!==cur)return false;
    if(s&&!t.name.toLowerCase().includes(s)&&!t.desc.toLowerCase().includes(s))return false;
    return true;
  });
}
function render(){
  const arr=filtered();
  document.getElementById('countSub').textContent=`共 ${arr.length} 个工具 · 点击卡片即可使用`;
  cards.style.display=listView?'none':'grid';
  list.style.display=listView?'flex':'none';
  cards.innerHTML=arr.map(t=>`
    <div class="card" data-id="${t.id}">
      <div class="top">
        <div class="ic">${ICONS[t.icon]}</div>
        <button class="star ${favs.has(t.id)?'on':''}" data-star="${t.id}" title="收藏">${favs.has(t.id)?'★':'☆'}</button>
      </div>
      <h3>${t.name}</h3>
      <p>${t.desc}</p>
      <div class="tags">${t.tags.map(x=>`<span class="${x==='热门'?'hot':''}">${x}</span>`).join('')}</div>
    </div>`).join('');
  list.innerHTML=arr.map(t=>`
    <div class="lrow" data-id="${t.id}">
      <div class="ic">${ICONS[t.icon]}</div>
      <div><div class="nm">${t.name}</div><div class="ds">${t.desc}</div></div>
      <span class="cat">${t.cat==='dev'?'开发':t.cat==='text'?'文本':t.cat==='image'?'图片':t.cat==='net'?'网络':'系统'}</span>
    </div>`).join('');
  cards.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-star]'))return;openTool(c.dataset.id);});
  list.querySelectorAll('.lrow').forEach(r=>r.onclick=()=>openTool(r.dataset.id));
  cards.querySelectorAll('[data-star]').forEach(s=>s.onclick=e=>{
    e.stopPropagation();const id=s.dataset.star;
    favs.has(id)?favs.delete(id):favs.add(id);
    document.getElementById('favCnt').textContent=favs.size;
    render();toast(favs.has(id)?'已加入收藏':'已取消收藏');
  });
}
/* 导航 */
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');cur=a.dataset.f;
  const names={all:'全部工具',dev:'开发工具',text:'文本处理',image:'图片工具',net:'网络工具',sys:'系统工具',fav:'我的收藏'};
  document.querySelector('.topbar h1').textContent=names[cur];
  render();
});
q.addEventListener('input',render);
/* 视图切换 */
const viewBtn=document.getElementById('viewBtn'),viewIco=document.getElementById('viewIco');
viewBtn.onclick=()=>{
  listView=!listView;
  viewIco.innerHTML=listView
    ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>';
  render();
};
/* 最近使用 */
document.querySelectorAll('.rchip').forEach(c=>c.onclick=()=>openTool(c.dataset.id));
/* 主题 */
const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{
  const dark=document.body.dataset.theme==='dark';
  document.body.dataset.theme=dark?'':'dark';
  themeBtn.innerHTML=dark
    ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/></svg>浅色模式'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5c-4.5 0-8.5-4-8.5-8.5z"/></svg>深色模式';
};
/* Toast */
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600);}
/* 弹窗 */
const mask=document.getElementById('mask');
document.getElementById('mClose').onclick=()=>mask.classList.remove('show');
mask.onclick=e=>{if(e.target===mask)mask.classList.remove('show');};
function openTool(id){
  const t=TOOLS.find(x=>x.id===id);
  document.getElementById('mIco').innerHTML=ICONS[t.icon];
  document.getElementById('mTitle').textContent=t.name;
  document.getElementById('mDesc').textContent=t.desc;
  document.getElementById('mDemo').innerHTML=demoHTML(t.id);
  mask.classList.add('show');
}
function demoHTML(id){
  const common=`
    <label>时间戳（秒 / 毫秒）</label>
    <input type="text" id="tsIn" value="${Math.floor(Date.now()/1000)}" spellcheck="false">
    <div class="row"><button class="btn primary" onclick="convTs()">转换</button></div>
    <div class="out" id="tsOut"></div>`;
  return common;
}
window.convTs=function(){
  const v=document.getElementById('tsIn').value.trim(),out=document.getElementById('tsOut');
  let ms=Number(v);
  if(!v||isNaN(ms)){out.textContent='请输入有效数字';return;}
  if(ms<1e12)ms*=1000;
  const d=new Date(ms);
  out.textContent=`标准时间 : ${d.toLocaleString('zh-CN',{hour12:false})}\nUTC 时间 : ${d.toUTCString()}\n毫秒 : ${d.getTime()}\n秒级 : ${Math.floor(d.getTime()/1000)}`;
};
render();
</script>
